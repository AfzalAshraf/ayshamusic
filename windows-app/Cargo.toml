[package]
name = "aysha-windows"
version = "0.6.0"
edition = "2021"
publish = false

[dependencies]
ayshamusic = { package = "aysha-music", path = "..", features = ["phone"] }
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"] }
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
url = "2"
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }
