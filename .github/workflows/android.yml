name: Android APK

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    paths:
      - "android-app/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

# Build install-test artifacts only; publishing is a separate explicit operation.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAX_APK_MB: "15"
      WARN_APK_MB: "12"
      CARGO_TERM_COLOR: always
      AYSHA_PREVIEW: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-35
            build-tools;35.0.0
            platform-tools
            ndk;27.2.12479018
            cmake;3.22.1

      # rodio/cpal link ALSA on the Linux runner, which ships no dev headers.
      - name: Install ALSA headers
        run: sudo timeout 240s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo timeout 240s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y libasound2-dev pkg-config ffmpeg

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: Rust checks (host)
        run: |
          mkdir -p "$RUNNER_TEMP/aysha-media"
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:duration=5' -c:a aac "$RUNNER_TEMP/aysha-media/tail.m4a"
          ffmpeg -hide_banner -loglevel error -i "$RUNNER_TEMP/aysha-media/tail.m4a" -c copy -movflags +faststart "$RUNNER_TEMP/aysha-media/front.m4a"
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'color=c=red:s=320x320' -frames:v 1 "$RUNNER_TEMP/aysha-media/cover.jpg"
          export AYSHA_MEDIA_FIXTURES="$RUNNER_TEMP/aysha-media"
          if ! cargo test --lib --features phone --locked > "$RUNNER_TEMP/phone-tests.log" 2>&1; then
            cat "$RUNNER_TEMP/phone-tests.log"
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/phone-tests.log").read()[-14000:]; print("::error title=Rust phone tests::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
          cat "$RUNNER_TEMP/phone-tests.log"
          cargo check --bin music-server --locked

      - name: Generate offline emulator audio fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/emulator-media"
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:duration=8' -c:a aac -b:a 128k -movflags +faststart "$RUNNER_TEMP/emulator-media/tone.m4a"
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=330:duration=600' -c:a aac -b:a 96k -movflags +faststart "$RUNNER_TEMP/emulator-media/long-tone.m4a"
      - uses: actions/upload-artifact@v4
        with:
          name: offline-emulator-audio-fixtures
          path: ${{ runner.temp }}/emulator-media/*.m4a
          retention-days: 3

      - name: Configure gated production signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AYSHA_RELEASE_ENABLED == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.AYSHA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AYSHA_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.AYSHA_KEY_ALIAS }}
          KEY_PASSWORD_VALUE: ${{ secrets.AYSHA_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ vars.AYSHA_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$ALIAS" && test -n "$KEY_PASSWORD_VALUE"
          [[ "$EXPECTED_CERT" =~ ^[a-fA-F0-9]{64}$ ]]
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD_VALUE" >> "$GITHUB_ENV"
          echo "AYSHA_PREVIEW=0" >> "$GITHUB_ENV"
          echo "AYSHA_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build Rust library + release APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash android-app/scripts/build_apk.sh

      - name: Enforce APK size budget
        run: |
          for variant in androidAudio; do
            bash android-app/scripts/measure_apk_size.sh android-app/app/build/outputs/apk/$variant/release/*.apk
          done

      - name: Validate production signing identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AYSHA_RELEASE_ENABLED == 'true'
        env:
          EXPECTED_CERT: ${{ vars.AYSHA_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=$(find android-app/app/build/outputs/apk/androidAudio/release -name '*.apk' -print -quit)
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/cert.txt"
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/cert.txt" | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$EXPECTED_CERT" | tr '[:upper:]' '[:lower:]')
          test "$actual" = "$expected"
          test "$(grep -c '^Signer #[0-9]* certificate SHA-256 digest:' "$RUNNER_TEMP/cert.txt")" = 1

      - name: Upload Android Audio APK
        uses: actions/upload-artifact@v4
        with:
          name: ayshamusic-android-audio-arm64
          path: android-app/app/build/outputs/apk/androidAudio/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Android website contract regressions
        run: node --test tests/android.test.cjs


      # Branch fixes are test artifacts, never overwrite the public main release.

  # The explicit production-source proof was consumed by43743729439 and passed.
  # Routine CI remains provider-offline; new live work needs a reviewed gate.

  media3-emulator-fixture:
    needs: build-apk
    # Actual Android decoder/control validation; no YouTube/account access and
    # no claim of complete Rust JNI/provider integration or physical audio.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      # Reuse fixtures from the job whose toolchain/package setup is verified;
      # Ubuntu 24 package mirrors have timed out before instrumentation starts.
      - uses: actions/download-artifact@v4
        with:
          name: offline-emulator-audio-fixtures
          path: android-app/app/src/androidTest/assets
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: cd android-app && ./gradlew --no-daemon -PayshaEmulatorTests=true connectedAndroidAudioDebugAndroidTest
      - name: Annotate actual instrumentation outcomes
        if: always()
        run: |
          python3 - <<'PYTEST'
          import glob,xml.etree.ElementTree as E
          paths=glob.glob('android-app/app/build/outputs/androidTest-results/connected/**/*.xml',recursive=True)
          if not paths:
              print('::warning title=Media3 emulator::No instrumentation result; emulator validation NOT PASSED')
          for path in paths:
              for case in E.parse(path).getroot().iter('testcase'):
                  failed=case.find('failure')
                  skipped=case.find('skipped')
                  status='FAIL' if failed is not None else ('SKIP' if skipped is not None else 'PASS')
                  detail='' if failed is None else ' '+(failed.attrib.get('message','')+' '+''.join(failed.itertext()))[:5000]
                  message=(status+' '+case.attrib.get('name','unknown')+detail).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                  print('::notice title=Media3 emulator::'+message)
          PYTEST
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media3-emulator-fixture-results
          path: |
            android-app/app/build/outputs/androidTest-results/
            android-app/app/build/reports/androidTests/
          if-no-files-found: warn

  publish-signed-update:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AYSHA_RELEASE_ENABLED == 'true'
    needs: [build-apk, media3-emulator-fixture]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: aysha-production-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ayshamusic-android-audio-arm64
          path: release-apk
      - name: Publish only current main, with pinned signer and immutable version
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CERT: ${{ vars.AYSHA_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || { echo 'Main moved; refusing stale release'; exit 1; }
          code=$((1000 + GITHUB_RUN_NUMBER))
          mkdir -p publish
          cp release-apk/*.apk publish/AyshaMusic-arm64.apk
          APK_SIZE=$(stat -c%s publish/AyshaMusic-arm64.apk)
          APK_SHA=$(sha256sum publish/AyshaMusic-arm64.apk | cut -d' ' -f1)
          export APK_SIZE APK_SHA code EXPECTED_CERT
          python3 - <<'PYJSON'
          import json,os
          code=int(os.environ['code'])
          data={'schema':1,'package_id':'com.afzal.ayshamusic.androidaudio10','version_code':code,'version_name':f'1.9.0.{code}','abi':'arm64-v8a','min_sdk':26,'size':int(os.environ['APK_SIZE']),'sha256':os.environ['APK_SHA'],'certificate_sha256':os.environ['EXPECTED_CERT'].lower(),'url':f'https://github.com/AfzalAshraf/ayshamusic/releases/download/android-v{code}/AyshaMusic-arm64.apk'}
          with open('publish/update.json','w') as f: json.dump(data,f,indent=2)
          PYJSON
          gh release create "android-v$code" publish/AyshaMusic-arm64.apk publish/update.json --target "$GITHUB_SHA" --title "Aysha Music 1.9.0.$code" --notes "Signed ARM64 Android update for commit $GITHUB_SHA. Android requires your confirmation to install." --latest
