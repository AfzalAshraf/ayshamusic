name: Android APK

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "android-app/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android-app/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

# `write` lets the job publish the built APK as a release asset.
permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAX_APK_MB: "15"
      WARN_APK_MB: "12"
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-35
            build-tools;35.0.0
            platform-tools
            ndk;27.2.12479018
            cmake;3.22.1

      # rodio/cpal link ALSA on the Linux runner, which ships no dev headers.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: Rust checks (host)
        run: |
          cargo test --lib
          cargo check --bin music-server

      - name: Build Rust library + release APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash android-app/scripts/build_apk.sh

      - name: Enforce APK size budget
        run: |
          bash android-app/scripts/measure_apk_size.sh \
            android-app/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ayshamusic-arm64-release
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # A durable download that does not expire with artifacts. The tag is
      # replaced on every build, so `apk-latest` always serves the newest APK.
      - name: Publish APK release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Aysha Music APK (latest)
          body: |
            Aysha Music 1.2.1 (versionCode 5), arm64-v8a, from ${{ github.sha }}.

            Playback fix:
            - Audio was cut off roughly 12 seconds into every track: the media
              stream used the API HTTP client, whose 12 s total timeout aborted
              the body mid-transfer. Media now uses its own client (connect
              timeout + 30 s read-stall guard, no overall cap).
            - Verified on the build host through the app's own code path: the
              full track streamed to its declared 3,449,447 bytes, and both
              ffprobe and ffmpeg decoded it (AAC, 44.1 kHz, stereo, 213.09 s).
            - NOT verified: audio from a phone speaker. No device was available;
              the release is published without a playback-on-device test.

            Library and navigation on Android:
            - /api/search is implemented (InnerTube search), so Home, Explore and
              the search bar return real songs on the phone instead of 404.
            - /api/next plays a *different* song: it searches for songs similar to
              the current title and skips the same video and the same song under
              another upload ("(Official Video)" vs "- Lyrical Video").
            - /api/prev walks back through the tracks started this session.
            - /api/player now includes duration_secs, so the progress bar fills.

            Known limits: Favorites, Queue and Bluetooth are still Linux-server
            features and return 404 on the phone. YouTube may answer
            "Sign in to confirm you're not a bot" for label music videos from
            datacenter IPs; the app shows that text instead of pretending to play.

            UI:
            - The page's play/pause/resume/stop/volume controls call the Rust
              endpoints directly, and every 400 ms the page renders /api/player:
              position, paused marker, volume, and the track name after a reload.

            Resolution changes:
            - InnerTube client versions are current (Android 20.10.38 / iOS 20.10.4);
              the previous 19.x versions returned HTTP 400 FAILED_PRECONDITION.
            - A visitor id is fetched from /youtubei/v1/visitor_id, cached in
              filesDir/yt_visitor.json and sent as X-Goog-Visitor-Id plus
              client.visitorData on every player request.
            - /api/selftest and /api/play failures report each attempt's client,
              HTTP status, visitor-id attachment and YouTube's own body.

            Honest limit: CI proves the APK builds, packages and fits the size
            budget; it cannot prove audio comes out of a phone speaker.
            Debug-signed, minSdk 26.
          files: android-app/app/build/outputs/apk/release/app-release.apk
          make_latest: true
