name: Windows Rust desktop candidate
on:
  push:
    branches: ["arena/**", main]
    paths: ["windows-app/**", "src/**", "Cargo.toml", "Cargo.lock", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows-app/**", "src/**", "Cargo.toml", "Cargo.lock", ".github/workflows/windows.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check signing script rejects invalid timestamp configuration
        shell: pwsh
        run: |
          $rejected = $false
          try {
            & ./windows-app/sign-candidate.ps1 -CertificateThumbprint ('0' * 40) -SignToolPath 'not-present.exe' -TimestampUrl 'https://user:password@example.invalid/'
          } catch { $rejected = $_.Exception.Message -like '*TimestampUrl*' }
          if (-not $rejected) { throw 'Signing script did not reject the invalid timestamp URL' }
      - name: Build native Rust desktop candidate
        working-directory: windows-app
        run: cargo build --release
      - name: Run offline Rust desktop tests
        working-directory: windows-app
        run: cargo test
      - name: Test Windows metadata network policy (offline)
        run: cargo test --manifest-path Cargo.toml --features phone --lib windows_direct_network_disables_explicit_proxy_offline
      - name: Package pinned yt-dlp executable
        shell: pwsh
        run: |
          $denoZip = "$env:RUNNER_TEMP/deno.zip"
          $denoDir = "$env:RUNNER_TEMP/deno-dist"
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/download/v2.9.8/deno-x86_64-pc-windows-msvc.zip" -OutFile $denoZip
          if ((Get-FileHash $denoZip -Algorithm SHA256).Hash.ToLower() -ne "cba84b26e0df5ae7f74fc66b86a95b866872a86292ebd84fa1e959927edd93bf") { throw "Deno checksum mismatch" }
          Expand-Archive -Path $denoZip -DestinationPath $denoDir
          Copy-Item "$denoDir/deno.exe" "windows-app/target/release/deno.exe"
          $denoPath = (Resolve-Path "windows-app/target/release/deno.exe").Path
          $denoVersion = & $denoPath --version
          if ($LASTEXITCODE -ne 0 -or $denoVersion[0] -notmatch 'deno 2\.9\.8') { throw "Unexpected Deno version" }
          $dest = "windows-app/target/release/yt-dlp.exe"
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp.exe" -OutFile $dest
          if ((Get-FileHash $dest -Algorithm SHA256).Hash.ToLower() -ne "f5389d3698ecde4ef06f4e6b1ce0294fe9ac1396228c8990b8d3416d6d177a7d") { throw "yt-dlp checksum mismatch" }
          & $dest --ignore-config --version
          if ($LASTEXITCODE -ne 0) { throw "yt-dlp version check failed" }
          $selected = & $dest --ignore-config --no-plugin-dirs --no-js-runtimes --no-remote-components --no-cache-dir --no-check-formats --simulate --load-info-json windows-app/fixtures/formats.json --print format_id -f 'bestaudio[acodec^=opus][ext=webm]/bestaudio[acodec^=mp4a][ext=m4a]/bestaudio[acodec^=mp4a][ext=mp4]'
          if ($LASTEXITCODE -ne 0 -or $selected -ne "webm-opus") { throw "Offline audio selection fixture failed: $selected" }
          $aacSelected = & $dest --ignore-config --no-plugin-dirs --no-js-runtimes --no-remote-components --no-cache-dir --no-check-formats --simulate --load-info-json windows-app/fixtures/formats-aac.json --print format_id -f 'bestaudio[acodec^=opus][ext=webm]/bestaudio[acodec^=mp4a][ext=m4a]/bestaudio[acodec^=mp4a][ext=mp4]'
          if ($LASTEXITCODE -ne 0 -or $aacSelected -ne "mp4-aac") { throw "Offline AAC fallback fixture failed: $aacSelected" }
          python windows-app/fixtures/test_offline_download.py $dest
          if ($LASTEXITCODE -ne 0) { throw "Offline audio download fixture failed" }
          Copy-Item windows-app/THIRD_PARTY.txt windows-app/target/release/THIRD_PARTY.txt
          $originalErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          $debugOutput = (& $dest --verbose --ignore-config --no-plugin-dirs --no-js-runtimes --js-runtimes "deno:$denoPath" --no-remote-components --no-cache-dir --no-check-formats --simulate --load-info-json windows-app/fixtures/formats.json --print format_id -f 'bestaudio[acodec^=opus][ext=webm]/bestaudio[acodec^=mp4a][ext=m4a]/bestaudio[acodec^=mp4a][ext=mp4]' 2>&1 | Out-String)
          $runtimeStatus = $LASTEXITCODE
          $ErrorActionPreference = $originalErrorActionPreference
          if ($runtimeStatus -ne 0 -or $debugOutput -notmatch 'JS runtimes:.*deno') { throw "Offline yt-dlp runtime recognition test failed: $debugOutput" }
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/denoland/deno/v2.9.8/LICENSE.md" -OutFile "windows-app/target/release/DENO-LICENSE.txt"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/yt-dlp/yt-dlp/2026.10.26/LICENSE" -OutFile "windows-app/target/release/YT-DLP-LICENSE.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: aysha-windows-rust-candidate
          path: |
            windows-app/target/release/aysha-windows.exe
            windows-app/target/release/yt-dlp.exe
            windows-app/target/release/deno.exe
            windows-app/target/release/DENO-LICENSE.txt
            windows-app/target/release/THIRD_PARTY.txt
            windows-app/target/release/YT-DLP-LICENSE.txt
          if-no-files-found: error
          retention-days: 14
