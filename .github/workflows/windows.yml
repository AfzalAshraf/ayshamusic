name: Windows Rust desktop candidate
on:
  push:
    branches: ["arena/**", main]
    paths: ["windows-app/**", "src/**", "Cargo.toml", "Cargo.lock", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows-app/**", "src/**", "Cargo.toml", "Cargo.lock", ".github/workflows/windows.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native Rust desktop candidate
        working-directory: windows-app
        run: cargo build --release
      - name: Run offline Rust desktop tests
        working-directory: windows-app
        run: cargo test
      - name: Package pinned yt-dlp executable
        shell: pwsh
        run: |
          $dest = "windows-app/target/release/yt-dlp.exe"
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp.exe" -OutFile $dest
          if ((Get-FileHash $dest -Algorithm SHA256).Hash.ToLower() -ne "f5389d3698ecde4ef06f4e6b1ce0294fe9ac1396228c8990b8d3416d6d177a7d") { throw "yt-dlp checksum mismatch" }
          & $dest --ignore-config --version
          if ($LASTEXITCODE -ne 0) { throw "yt-dlp version check failed" }
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/yt-dlp/yt-dlp/2026.10.26/LICENSE" -OutFile "windows-app/target/release/YT-DLP-LICENSE.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: aysha-windows-rust-candidate
          path: |
            windows-app/target/release/aysha-windows.exe
            windows-app/target/release/yt-dlp.exe
            windows-app/target/release/YT-DLP-LICENSE.txt
            windows-app/Cargo.lock
          if-no-files-found: error
          retention-days: 14
