name: Local Linux checks
on:
  push:
    branches: [arena/a850fb0d-ayshamusic]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust regression tests
        run: cargo test
      - name: Build local server
        run: cargo build --release
      - name: Python checker tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Embedded frontend regression tests
        run: node --test tests/frontend.test.cjs tests/vercel-preview.test.cjs
      - name: Linux script syntax
        run: bash -n scripts/install_local.sh scripts/diagnose_local.sh
  rust-audio-prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install prototype build and test-only media dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config ffmpeg
      - name: Test isolated Rust audio prototype
        run: cargo test --manifest-path prototypes/rust-audio/Cargo.toml
      - name: Build isolated prototype
        run: cargo build --release --manifest-path prototypes/rust-audio/Cargo.toml
      - name: Decode fixtures and exercise null audio output
        run: |
          set +e
          bash tests/rust_audio_smoke.sh prototypes/rust-audio/target/release/aysha-audio-prototype > prototype-smoke.log 2>&1
          result=$?
          set -e
          cat prototype-smoke.log
          if [[ $result -ne 0 ]]; then
            detail=$(tail -c 8000 prototype-smoke.log)
            detail="${detail//'%'/'%25'}"
            detail="${detail//$'\r'/'%0D'}"
            detail="${detail//$'\n'/'%0A'}"
            printf '::error title=Prototype smoke failure::%s\n' "$detail"
          fi
          exit "$result"
      - name: Retain resolved prototype dependency lock for reproducibility
        uses: actions/upload-artifact@v4
        with:
          name: rust-audio-lock
          path: prototypes/rust-audio/Cargo.lock
  mobile-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test-only browser tools outside the repository
        run: npm install --prefix "$RUNNER_TEMP/aysha-browser" --no-audit --no-fund playwright-core@1.65.0 @sparticuz/chromium@153.0.0
      - name: Portrait layout and browser navigation
        run: BROWSER_TEST_MODULES="$RUNNER_TEMP/aysha-browser/node_modules" node tests/mobile.browser.cjs

      - name: Generated Vercel static preview browser checks
        run: BROWSER_TEST_MODULES="$RUNNER_TEMP/aysha-browser/node_modules" node tests/vercel-preview.browser.cjs

  rust-extract-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Recreate the reported existing-lock ICU conflict
        run: bash tests/rust_extract_dependency_upgrade.sh seed
      - name: Test isolated native extraction candidate (offline tests)
        run: cargo test --manifest-path prototypes/rust-extract/Cargo.toml
      - name: Verify the existing-lock dependency migration
        run: bash tests/rust_extract_dependency_upgrade.sh verify
      - name: Build isolated extraction candidate
        run: cargo build --release --manifest-path prototypes/rust-extract/Cargo.toml
      - name: Strict CLI smoke without upstream network
        run: |
          prototypes/rust-extract/target/release/aysha-extract-prototype --help
          if prototypes/rust-extract/target/release/aysha-extract-prototype --video-id invalid; then exit 1; fi
      - name: Retain prototype dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: rust-extract-lock
          path: prototypes/rust-extract/Cargo.lock

  rust-direct-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test bounded direct-request prototype
        run: cargo test --manifest-path prototypes/rust-direct/Cargo.toml
      - name: Build bounded direct-request prototype
        run: cargo build --release --locked --manifest-path prototypes/rust-direct/Cargo.toml
      - name: Verify dependency graph excludes extractor and JS engines
        run: |
          cargo tree --locked --manifest-path prototypes/rust-direct/Cargo.toml > direct-dependencies.txt
          if grep -E 'boa_|rusty_ytdl|rquickjs|quick-js' direct-dependencies.txt; then exit 1; fi
          prototypes/rust-direct/target/release/aysha-direct-prototype --help
          if prototypes/rust-direct/target/release/aysha-direct-prototype --video-id invalid; then exit 1; fi
      - name: Record two public compatibility observations (not target-host acceptance)
        run: |
          for case in requested:Jm7Satp7Zqk reference:BaW_jenozKc; do
            label=${case%%:*}
            id=${case#*:}
            set +e
            result=$(timeout --kill-after=2s 75s prototypes/rust-direct/target/release/aysha-direct-prototype --video-id "$id" 2>/dev/null)
            code=$?
            set -e
            RESULT="$result" CODE="$code" LABEL="$label" python3 - <<'PY'
          import json, os
          try:
              value = json.loads(os.environ['RESULT'])
              allowed = ('status', 'candidate', 'code', 'bytes', 'itag', 'resolve_ms', 'first_byte_ms', 'total_ms', 'peak_rss_kib', 'production_ready')
              report = {key: value[key] for key in allowed if key in value}
          except (ValueError, TypeError):
              report = {'status':'incomplete', 'code':'probe_timeout_or_invalid_output'}
          report['process_exit'] = int(os.environ['CODE'])
          report['case'] = os.environ['LABEL']
          # Upstream failure remains explicit; this records evidence, not a live acceptance pass.
          print('::notice title=Direct extraction compatibility observation::' + json.dumps(report))
          PY
          done
      - name: Retain direct prototype dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: rust-direct-lock
          path: prototypes/rust-direct/Cargo.lock
