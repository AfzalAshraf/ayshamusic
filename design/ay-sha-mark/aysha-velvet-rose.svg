<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Aysha Music — Velvet Rose</title>
  <desc id="description">A rose-gold geometric A with a MUSIC crossbar, subtle vinyl rings, balanced equalizer accents and an Aysha wordmark on deep velvet plum. Typography is outlined for consistent rendering.</desc>
  <!-- Refined from Afzal's supplied SVG. Plus Jakarta Sans glyph outlines; SIL OFL 1.1. -->
  <defs>
    <linearGradient id="velvet" x1="100" y1="0" x2="894" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#29131F"/><stop offset=".52" stop-color="#1C0C15"/><stop offset="1" stop-color="#10060C"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="408" r="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EA9B8C" stop-opacity=".14"/><stop offset=".65" stop-color="#AC5965" stop-opacity=".045"/><stop offset="1" stop-color="#11060B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rose" x1="310" y1="220" x2="685" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCE3DA"/><stop offset=".36" stop-color="#F0B6A6"/><stop offset=".7" stop-color="#DD9283"/><stop offset="1" stop-color="#C7796D"/>
    </linearGradient>
    <linearGradient id="edge" x1="415" y1="254" x2="512" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF0E4" stop-opacity=".7"/><stop offset="1" stop-color="#FFF0E4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#velvet)"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>
  <!-- Quiet groove rings provide a music cue without competing with the A. -->
  <g id="grooves" stroke="url(#rose)">
    <circle cx="512" cy="435" r="250" stroke-width="3" opacity=".25"/>
    <circle cx="512" cy="435" r="222" stroke-width="2" opacity=".12" stroke-dasharray="2 12" stroke-linecap="round"/>
  </g>
  <g id="equalizer" stroke="url(#rose)" stroke-width="12" stroke-linecap="round" opacity=".8">
    <path d="M222 416v38M250 394v82M774 394v82M802 416v38"/>
  </g>
  <!-- Open counter and strong legs preserve recognition as the mark scales down. -->
  <path id="monogram" d="M512 234 324 624h72l116-250 116 250h72L512 234Z" fill="url(#rose)"/>
  <path d="m512 250-174 362" stroke="url(#edge)" stroke-width="3" stroke-linecap="round"/>
  <!-- The crossbar is wider and less ornate so MUSIC survives reduction better. -->
  <rect x="361" y="465" width="302" height="70" rx="35" fill="#1B0B14" stroke="url(#rose)" stroke-width="5"/>
