[package]
name = "aysha-audio-prototype"
version = "0.1.0"
edition = "2021"
publish = false

# Intentionally isolated: building music-server does not enable these dependencies.
[dependencies]
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "wav", "mp4", "mp3", "flac", "vorbis"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
