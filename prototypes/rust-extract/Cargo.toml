[package]
name = "aysha-extract-prototype"
version = "0.1.0"
edition = "2021"
publish = false

# Native extraction candidate. No CLI wrapper, external JS runtime, live or ffmpeg feature.
[dependencies]
rusty_ytdl = { version = "=0.7.4", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
