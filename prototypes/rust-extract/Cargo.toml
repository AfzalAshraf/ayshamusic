[package]
name = "aysha-extract-prototype"
version = "0.1.0"
edition = "2021"
publish = false

# Native extraction candidate. No CLI wrapper, external JS runtime, live or ffmpeg feature.
[dependencies]
# Experimental upstream PR62: reviewed client-request update, immutable revision.
# Published 0.7.4 failed the actual host probe; see docs/RUST_EXTRACT_PROTOTYPE.md.
rusty_ytdl = { git = "https://github.com/restalex/rusty_ytdl", rev = "b390352a5db4b57aa630e8dc7b427fb560feccd5", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
