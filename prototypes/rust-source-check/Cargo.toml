[package]
name = "aysha-rust-source-check"
version = "0.1.0"
edition = "2021"
publish = false

# Isolated research only; not an APK dependency. The upstream PR adds the VR
# profile to the existing Rust/Boa extractor. Pin the exact reviewed revision.
[dependencies]
rusty_ytdl = { git = "https://github.com/Mithronn/rusty_ytdl", rev = "b390352a5db4b57aa630e8dc7b427fb560feccd5", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time"] }
serde_json = "1"
futures-util = "0.3"

[profile.release]
opt-level = "s"
strip = true
